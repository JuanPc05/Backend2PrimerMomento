spring.application.name=huellitas
# ===== CONEXIÓN A MARIADB =====
spring.datasource.url=jdbc:mariadb://localhost:3306/huellitas_db
# Desglose de la URL:
#   jdbc:mariadb://  -> protocolo del driver de MariaDB
#   localhost:3306   -> host y puerto (3306 es el puerto por defecto de MariaDB)
#   /huellitas_db    -> el nombre EXACTO de tu base de datos

spring.datasource.username=juanpc
spring.datasource.password=
# Cambia estos por tus credenciales reales de MariaDB.
# (En un proyecto serio esto NO va hardcodeado aquí, sino en variables
#  de entorno. Para la actividad está bien, pero tenlo presente para
#  la sustentación si te preguntan por seguridad.)

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# La clase Java del driver de MariaDB. Spring puede deducirla sola desde
# la URL, pero declararla explícita te obliga a entender qué motor usas.

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=validate
# CLAVE: 'validate' porque TÚ eres el dueño del esquema (lo creaste a mano).
# Hibernate NO toca tu tabla; solo compara tu @Entity contra la tabla real
# y falla el arranque si no coinciden. Es tu red de seguridad.

spring.jpa.show-sql=true
# Muestra en consola cada SQL que Hibernate ejecuta. Muy útil para aprender
# y para tu sustentación: puedes VER el INSERT que genera un POST.

spring.jpa.properties.hibernate.format_sql=true
# Formatea ese SQL de la consola para que sea legible (con saltos de línea).